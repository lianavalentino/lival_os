<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVAL OS — Superpowers Kanban</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-done: #10b981;
            --color-progress: #f59e0b;
            --color-todo: #6b7280;
            --color-card-bg: #ffffff;
            --color-column-bg: #f3f4f6;
            --color-border: #e5e7eb;
            --color-text: #1f2937;
            --color-text-light: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--color-text);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--color-text-light);
            font-size: 14px;
        }

        .phase-section {
            margin-bottom: 40px;
        }

        .phase-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            padding: 10px 0;
            border-bottom: 2px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .phase-title .status-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .phase-chevron {
            display: inline-flex;
            transition: transform 0.2s ease;
            font-size: 14px;
            color: var(--color-text-light);
        }

        .phase-section.collapsed .phase-chevron {
            transform: rotate(-90deg);
        }

        .phase-section.collapsed .phase-body {
            display: none;
        }

        .phase-docs {
            display: flex;
            gap: 8px;
            margin-left: auto;
            font-size: 12px;
            font-weight: 500;
        }

        .phase-docs a {
            color: #2563eb;
            text-decoration: none;
            padding: 2px 8px;
            border-radius: 4px;
            background: #eff6ff;
        }

        .phase-docs a:hover {
            text-decoration: underline;
        }

        .status-badge.done {
            background: #d1fae5;
            color: var(--color-done);
        }

        .status-badge.progress {
            background: #fef3c7;
            color: var(--color-progress);
        }

        .status-badge.todo {
            background: #f3f4f6;
            color: var(--color-todo);
        }

        .columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .column {
            background: var(--color-column-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 15px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
            color: var(--color-text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .column-count {
            background: var(--color-border);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            color: var(--color-text-light);
        }

        .cards {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 200px;
        }

        .card {
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 12px;
            cursor: grab;
            transition: all 0.2s ease;
            font-size: 13px;
            line-height: 1.4;
        }

        .card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .card-title {
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--color-text);
        }

        .card-notes {
            color: var(--color-text-light);
            font-size: 12px;
            line-height: 1.3;
        }

        .empty-column {
            color: var(--color-text-light);
            text-align: center;
            padding: 20px;
            font-size: 12px;
        }

        .phase-summary {
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 12px;
            font-size: 13px;
            color: var(--color-text-light);
            margin-bottom: 20px;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        .summary-table td, .summary-table th {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--color-border);
            font-size: 13px;
        }

        .summary-table th {
            font-weight: 600;
            background: var(--color-column-bg);
        }

        .summary-table .phase-cell {
            font-weight: 600;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            border: 1px solid var(--color-border);
            color: var(--color-text);
        }

        button:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-1px);
        }

        button.primary {
            background: var(--color-done);
            color: white;
            border: none;
        }

        button.primary:hover {
            background: #059669;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        let boardData = [...PHASES];

        function getStorageKey(taskId) {
            return `kanban_task_${taskId}`;
        }

        function loadTaskStatus(taskId, defaultStatus) {
            const stored = localStorage.getItem(getStorageKey(taskId));
            return stored || defaultStatus;
        }

        function saveTaskStatus(taskId, status) {
            localStorage.setItem(getStorageKey(taskId), status);
        }

        function clearStorage() {
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith('kanban_task_') || key.startsWith('kanban_phase_collapsed_')) {
                    localStorage.removeItem(key);
                }
            });
        }

        function getPhaseCollapseKey(phaseId) {
            return `kanban_phase_collapsed_${phaseId}`;
        }

        function isPhaseCollapsed(phaseId) {
            return localStorage.getItem(getPhaseCollapseKey(phaseId)) === '1';
        }

        function togglePhaseCollapsed(phaseId) {
            const collapsed = isPhaseCollapsed(phaseId);
            if (collapsed) {
                localStorage.removeItem(getPhaseCollapseKey(phaseId));
            } else {
                localStorage.setItem(getPhaseCollapseKey(phaseId), '1');
            }
            renderBoard();
        }

        function resetBoard() {
            if (confirm('Reset all changes? This will clear your local storage.')) {
                clearStorage();
                location.reload();
            }
        }

        function exportData() {
            const data = PHASES.map(phase => ({
                phase: phase.id,
                name: phase.name,
                tasks: phase.tasks.map(t => ({
                    title: t.title,
                    status: loadTaskStatus(t.id, t.status),
                    notes: t.notes
                }))
            }));
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `kanban-export-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function renderBoard() {
            const board = document.getElementById('kanban-board');
            let html = '';

            boardData.forEach(phase => {
                const tasks = phase.tasks.map(t => ({
                    ...t,
                    status: loadTaskStatus(t.id, t.status)
                }));

                const done = tasks.filter(t => t.status === 'done').length;
                const progress = tasks.filter(t => t.status === 'progress').length;
                const todo = tasks.filter(t => t.status === 'todo').length;
                const collapsed = isPhaseCollapsed(phase.id);
                const docsHtml = (phase.docs || [])
                    .map(d => `<a href="${d.href}" target="_blank" rel="noopener">${d.label}</a>`)
                    .join('');

                html += `
                    <div class="phase-section ${collapsed ? 'collapsed' : ''}" data-phase-id="${phase.id}">
                        <div class="phase-title" data-toggle-phase="${phase.id}">
                            <span class="phase-chevron">▼</span>
                            Phase ${phase.id}: ${phase.name}
                            <span class="status-badge ${phase.status}">${phase.status.toUpperCase()}</span>
                            ${docsHtml ? `<span class="phase-docs">${docsHtml}</span>` : ''}
                        </div>
                        <div class="phase-body">
                            <div class="phase-summary">
                                ⏳ ${todo} todo • 🔄 ${progress} in progress • ✅ ${done} done
                            </div>
                            <div class="columns">
                                ${renderColumn(tasks, 'todo', `Todo (${todo})`)}
                                ${renderColumn(tasks, 'progress', `In Progress (${progress})`)}
                                ${renderColumn(tasks, 'done', `Done (${done})`)}
                            </div>
                        </div>
                    </div>
                `;
            });

            board.innerHTML = html;
            attachDragListeners();
            attachPhaseToggleListeners();
        }

        function attachPhaseToggleListeners() {
            document.querySelectorAll('[data-toggle-phase]').forEach(title => {
                title.addEventListener('click', e => {
                    if (e.target.closest('.phase-docs')) return;
                    togglePhaseCollapsed(title.getAttribute('data-toggle-phase'));
                });
            });
        }

        function renderColumn(tasks, status, label) {
            const columnTasks = tasks.filter(t => t.status === status);
            const statusEmoji = { done: '✅', progress: '🔄', todo: '⏳' }[status];
            const statusClass = { done: 'done', progress: 'progress', todo: 'todo' }[status];

            let html = `
                <div class="column" data-status="${status}">
                    <div class="column-header">
                        <span>${statusEmoji} ${label}</span>
                        <span class="column-count">${columnTasks.length}</span>
                    </div>
                    <div class="cards" data-status="${status}">
            `;

            if (columnTasks.length === 0) {
                html += `<div class="empty-column">No tasks</div>`;
            } else {
                columnTasks.forEach(task => {
                    html += `
                        <div class="card fade-in" draggable="true" data-id="${task.id}" data-status="${status}">
                            <div class="card-title">${task.title}</div>
                            <div class="card-notes">${task.notes}</div>
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                </div>
            `;

            return html;
        }

        function attachDragListeners() {
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                card.addEventListener('dragstart', e => {
                    draggedCard = card;
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                card.addEventListener('dragend', e => {
                    card.classList.remove('dragging');
                    draggedCard = null;
                });
            });

            const columns = document.querySelectorAll('.cards');

            columns.forEach(column => {
                column.addEventListener('dragover', e => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    column.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
                });

                column.addEventListener('dragleave', e => {
                    column.style.backgroundColor = '';
                });

                column.addEventListener('drop', e => {
                    e.preventDefault();
                    column.style.backgroundColor = '';

                    if (draggedCard) {
                        const newStatus = column.getAttribute('data-status');
                        const taskId = draggedCard.getAttribute('data-id');
                        const oldStatus = draggedCard.getAttribute('data-status');

                        if (newStatus !== oldStatus) {
                            saveTaskStatus(taskId, newStatus);
                        }

                        column.appendChild(draggedCard);
                        draggedCard.setAttribute('data-status', newStatus);
                        renderBoard();
                    }
                });
            });
        }

        function renderSummary() {
            const tbody = document.getElementById('summary-tbody');
            let html = '';

            PHASES.forEach(phase => {
                const tasks = phase.tasks.map(t => ({
                    ...t,
                    status: loadTaskStatus(t.id, t.status)
                }));
                const done = tasks.filter(t => t.status === 'done').length;
                const total = tasks.length;
                const statusText = phase.status === 'done' ? '✅ Done' :
                                   phase.status === 'progress' ? '🔄 In Progress' : '⏳ Todo';

                html += `
                    <tr>
                        <td class="phase-cell">Phase ${phase.id}</td>
                        <td>${statusText}</td>
                        <td>${total} tasks</td>
                        <td>${phase.summary}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // Initialize
        renderBoard();
        renderSummary();
    </script>
</body>
</html>
